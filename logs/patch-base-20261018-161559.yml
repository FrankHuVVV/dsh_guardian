# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      xixixr:
        apiKeyEnv: XIXIXR_API_KEY
        api: openai-completions
        baseURL: https://api.openasi.bitmiracle.cn/v1
        models:
          - id: gpt-6-astra
            name: gpt-6-astra
        displayName: GPT 6 Astra
      xav1er:
        displayName: GPT 6.1 SOL
        apiKeyEnv: XAV1ER_API_KEY
        api: openai-completions
        baseURL: https://api.openasi.bitmiracle.cn/v1
        models:
          - id: gpt-6.1-sol
            name: gpt-6.1-sol
      miracle:
        displayName: Claude Opus 5.5
        apiKeyEnv: MIRACLE_API_KEY
        api: openai-completions
        baseURL: https://api.openasi.bitmiracle.cn/v1
        models:
          - id: claude-opus-5-5
            name: claude-opus-5-5
      gem:
        displayName: Claude Sonnet 5.5
        apiKeyEnv: GEM_API_KEY
        api: openai-completions
        baseURL: https://api.openasi.bitmiracle.cn/v1
        models:
          - id: claude-sonnet-5-5
            name: claude-sonnet-5-5
      marlon:
        displayName: Gemini 3.8 flash
        apiKeyEnv: MARLON_API_KEY
        api: openai-completions
        baseURL: https://api.openasi.bitmiracle.cn/v1
        models:
          - id: gemini-3.8-flash
            name: gemini-3.8-flash
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-v4-pro
    reasoningEffort: high
